<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Item | Pre-Owned Market</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="name">CAMPUS MARKETPLACE</div>
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="index.html#about">ABOUT</a>
        <a href="index.html#gallery">GALLERY</a>
        <a href="index.html#contact">CONTACT</a>
        <a href="list.html">LIST ITEM</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="card form-card">
      <img src="assets/images/preview.jpg" alt="Item Preview">
      <h2>List an Item</h2>

      <form action="index.html">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Item Details And Price</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Post Item</button>
      </form>
    </section>
  </main>

  <footer style ="background-color: var(--header-color);">
    <p>@2026 Campus Marketplace</p>
  </footer>

</body>
</html>
